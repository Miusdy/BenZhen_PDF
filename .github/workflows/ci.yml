name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install -e ".[dev]"
      - run: python build/scripts/generate_fixtures.py
      - run: pytest --cov=pdf2word --cov-report=term-missing
      - run: python build/scripts/check_text_size.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  tauri:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Provide placeholder sidecar for compile-time validation
        run: cp /usr/bin/true frontend/src-tauri/binaries/pdf2word-sidecar-aarch64-apple-darwin
      - run: cargo test --locked
        working-directory: frontend/src-tauri
