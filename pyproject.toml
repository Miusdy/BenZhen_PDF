[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "benzhen-pdf2word"
version = "1.0.2"
description = "Privacy-first, traceable PDF to editable Word conversion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Benzhen PDF contributors" }]
keywords = ["pdf", "docx", "ocr", "tesseract", "document-conversion"]
dependencies = [
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "rapidfuzz>=3.9,<4",
  "pytesseract>=0.3.13,<0.4",
  "opencv-python-headless>=4.10,<5",
  "fonttools>=4.53,<5",
  "typer>=0.12,<1",
  "typing-extensions>=4.6,<5; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "reportlab>=4,<5", "pypdf>=6,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]
packaging = ["pyinstaller>=6.10,<7"]

[project.scripts]
pdf2word = "pdf2word.cli:main"
pdf2word-sidecar = "pdf2word.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pdf2word"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"backend/src/pdf2word/docx_writer.py" = ["BLE001"]
"backend/src/pdf2word/pdf_reader.py" = ["BLE001", "S112"]
"backend/src/pdf2word/sidecar.py" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pdf2word"]

[[tool.mypy.overrides]]
module = ["pdf2word.pdf_reader", "pdf2word.pipeline", "pdf2word.docx_writer"]
disable_error_code = ["no-untyped-call", "no-any-return"]

[[tool.mypy.overrides]]
module = ["pytesseract", "pytesseract.*"]
ignore_missing_imports = true
